# HISOB PRO — ҷадвали Telegram: 09:00 ёдраскунии қарзҳо, 21:00 ҳисобот/суратҳо/нусхаи эҳтиётӣ (Asia/Dushanbe = UTC+5)
# Сервери ройгони Render "хоб" мекунад, бинобар ин GitHub ҳар бегоҳ онро бедор мекунад.
# Бехатар: /api/telegram/tick ҳар корро танҳо як бор дар рӯз ва танҳо дар вақташ иҷро мекунад.
name: Telegram — ҷадвал (09:00 ва 21:00)

on:
  schedule:
    - cron: '2 4 * * *'    # 09:02 Душанбе — ёдраскунии қарзҳо, ҷамъбасти моҳ
    - cron: '2 16 * * *'   # 21:02 Душанбе
    - cron: '35 16 * * *'  # 21:35 Душанбе — кӯшиши дуюм
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Бедор кардани сервер ва фиристодани ҳисобот
        env:
          URL: ${{ vars.HISOB_URL || 'https://hisob-pro.onrender.com' }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS -m 90 -X POST "$URL/api/telegram/tick"; then echo; exit 0; fi
            echo "Сервер ҳанӯз бедор нашуд, кӯшиши $i…"; sleep 20
          done
          exit 1
