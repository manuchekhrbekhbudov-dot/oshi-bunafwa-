# Render Blueprint — HISOB PRO
# Render.com → New → Blueprint → ҳамин репозиторийро интихоб кунед → Apply
# Базаи ройгони Render баъди 30 рӯз нест мешавад → базаи асосӣ акнун Neon (neon.tech, ройгон ва доимӣ).
# Ин база танҳо барои кӯчонидани маълумоти кӯҳна (OLD_DATABASE_URL) монда шудааст; баъд нест кардан мумкин.
databases:
  - name: hisob-pro-db
    plan: free
    databaseName: hisob_pro
    user: hisob

services:
  - type: web
    name: hisob-pro
    runtime: node
    plan: free
    rootDir: hisob-pro
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: SESSION_TTL_DAYS
        value: 14
      # Платформаи шахсӣ: танҳо ҳисоби аввалин сохта мешавад (open — барои ҳама)
      - key: REGISTRATION
        value: first-user
      # Токени боти Telegram аз @BotFather — дар Render дастӣ ворид мешавад, дар репозиторий НЕСТ
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Суроғаи базаи Neon (postgresql://...neon.tech/...?sslmode=require) — дастӣ дар Render
      - key: DATABASE_URL
        sync: false
      # Як бор: суроғаи базаи кӯҳнаи Render — ҳангоми оғоз ҳамаи маълумот ба базаи нав нусха мешавад
      - key: OLD_DATABASE_URL
        sync: false
