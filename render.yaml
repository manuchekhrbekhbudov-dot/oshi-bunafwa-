# Render Blueprint — HISOB PRO
# Render.com → New → Blueprint → ҳамин репозиторийро интихоб кунед → Apply
databases:
  - name: hisob-pro-db
    plan: free
    databaseName: hisob_pro
    user: hisob

services:
  - type: web
    name: hisob-pro
    runtime: node
    plan: free
    rootDir: hisob-pro
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: SESSION_TTL_DAYS
        value: 14
      - key: DATABASE_URL
        fromDatabase:
          name: hisob-pro-db
          property: connectionString
